<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Background watercolor wash -->
    <linearGradient id="asthmaBgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" stop-opacity="1" />
      <stop offset="35%" stop-color="#F7FAF7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#EDF4F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#DFEDE6" stop-opacity="0.95" />
    </linearGradient>

    <!-- Expansive fresh air glow (светящийся чистый воздух) -->
    <radialGradient id="breathGlow" cx="64%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#E8F7F0" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#D7EFE4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FDFBF7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="airCoreGlow" cx="65%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#EAFBF4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FDFBF7" stop-opacity="0" />
    </radialGradient>

    <!-- Bronchial branch gradients -->
    <linearGradient id="bronchTrunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7560" />
      <stop offset="100%" stop-color="#244432" />
    </linearGradient>

    <linearGradient id="lungFoliage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E9780" />
      <stop offset="100%" stop-color="#2C4F3B" />
    </linearGradient>

    <linearGradient id="airflowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FDFBF7" stop-opacity="0" />
      <stop offset="50%" stop-color="#5B9E7E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2E694D" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="600" fill="url(#asthmaBgWash)" />

  <!-- Luminous Fresh Air Radiance (Светящийся простор чистого воздуха) -->
  <circle cx="650" cy="300" r="280" fill="url(#breathGlow)" />
  <circle cx="650" cy="270" r="160" fill="url(#airCoreGlow)" />

  <!-- Mountain Air Mist Layers at Base (Чистый горный/лесной воздух) -->
  <path d="M 380 600 Q 520 480 680 520 T 900 470 L 900 600 Z" fill="#2E543E" fill-opacity="0.08" />
  <path d="M 450 600 Q 590 440 760 480 T 900 420 L 900 600 Z" fill="#507862" fill-opacity="0.12" />

  <!-- Dynamic Luminous Airflow Streams (Потоки свободного дыхания, проходящие без спазма) -->
  <g fill="none" stroke-linecap="round">
    <!-- Main sweeping inhalation breath stream -->
    <path d="M 280 340 C 400 320, 520 280, 610 240 C 670 210, 720 160, 780 120" stroke="url(#airflowGrad)" stroke-width="3" opacity="0.6" />
    <path d="M 320 380 C 440 370, 550 330, 640 280 C 710 240, 770 200, 840 180" stroke="url(#airflowGrad)" stroke-width="2.2" opacity="0.5" />
    <path d="M 360 430 C 470 410, 570 380, 660 340 C 730 310, 800 290, 880 270" stroke="url(#airflowGrad)" stroke-width="1.8" opacity="0.4" />

    <!-- Spiraling, relaxed eddies of air -->
    <path d="M 520 180 C 580 150, 640 160, 660 210 C 680 260, 630 300, 580 280 C 540 260, 550 200, 600 180 C 640 160, 690 190, 710 230" stroke="#719B84" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.45" />
  </g>

  <!-- Bronchial Tree & Open Lungs (Ботаническое древо бронхов в форме свободных открытых лёгких) -->
  <g id="botanicalLungs" transform="translate(640, 310)">

    <!-- Trachea (Ствол дыхательного дерева) -->
    <path d="M 0 -180 L 0 -80" stroke="url(#bronchTrunk)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Trachea rings (хрящевые кольца трахеи в стилизованном виде) -->
    <line x1="-8" y1="-160" x2="8" y2="-160" stroke="#729883" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-8" y1="-140" x2="8" y2="-140" stroke="#729883" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-8" y1="-120" x2="8" y2="-120" stroke="#729883" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-8" y1="-100" x2="8" y2="-100" stroke="#729883" stroke-width="1.8" stroke-linecap="round" />

    <!-- Carina bifurcation into Left & Right Main Bronchus (Бифуркация на правый и левый бронх) -->
    <!-- Left Main Bronchus Branch -->
    <path d="M 0 -80 Q -30 -50 -70 -40 Q -110 -30 -140 -10 Q -160 10 -170 40" fill="none" stroke="url(#bronchTrunk)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Secondary Left branches -->
    <path d="M -70 -40 Q -95 -75 -125 -95 Q -150 -110 -175 -120" fill="none" stroke="url(#bronchTrunk)" stroke-width="3" stroke-linecap="round" />
    <path d="M -110 -30 Q -135 -15 -160 0 Q -185 20 -200 50" fill="none" stroke="url(#bronchTrunk)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -140 -10 Q -160 -30 -180 -40" fill="none" stroke="url(#bronchTrunk)" stroke-width="2" stroke-linecap="round" />
    <path d="M -140 -10 Q -150 30 -155 70 Q -160 110 -140 145" fill="none" stroke="url(#bronchTrunk)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M -155 70 Q -180 85 -195 115" fill="none" stroke="url(#bronchTrunk)" stroke-width="2" stroke-linecap="round" />

    <!-- Right Main Bronchus Branch -->
    <path d="M 0 -80 Q 30 -50 70 -40 Q 110 -30 140 -10 Q 160 10 170 40" fill="none" stroke="url(#bronchTrunk)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Secondary Right branches -->
    <path d="M 70 -40 Q 95 -75 125 -95 Q 150 -110 175 -120" fill="none" stroke="url(#bronchTrunk)" stroke-width="3" stroke-linecap="round" />
    <path d="M 110 -30 Q 135 -15 160 0 Q 185 20 200 50" fill="none" stroke="url(#bronchTrunk)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 140 -10 Q 160 -30 180 -40" fill="none" stroke="url(#bronchTrunk)" stroke-width="2" stroke-linecap="round" />
    <path d="M 140 -10 Q 150 30 155 70 Q 160 110 140 145" fill="none" stroke="url(#bronchTrunk)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 155 70 Q 180 85 195 115" fill="none" stroke="url(#bronchTrunk)" stroke-width="2" stroke-linecap="round" />

    <!-- Lung Foliage Clusters: Pine Needles, Eucalyptus & Fern Fronds forming the full lung contours -->
    <!-- Left Lung Foliage (Левое крыло лёгкого — чистое, свободное, дышащее) -->
    <g fill="url(#lungFoliage)" stroke="#264332" stroke-width="0.5" opacity="0.9">
      <!-- Upper lobe -->
      <ellipse cx="-130" cy="-100" rx="22" ry="14" transform="rotate(-35 -130 -100)" />
      <ellipse cx="-165" cy="-115" rx="18" ry="11" transform="rotate(-40 -165 -115)" />
      <ellipse cx="-110" cy="-75" rx="19" ry="12" transform="rotate(-20 -110 -75)" />
      <ellipse cx="-150" cy="-65" rx="20" ry="13" transform="rotate(-30 -150 -65)" />
      <!-- Middle region -->
      <ellipse cx="-185" cy="-25" rx="22" ry="13" transform="rotate(-15 -185 -25)" />
      <ellipse cx="-195" cy="20" rx="23" ry="14" transform="rotate(10 -195 20)" />
      <ellipse cx="-155" cy="15" rx="22" ry="14" transform="rotate(0 -155 15)" />
      <ellipse cx="-180" cy="65" rx="22" ry="13" transform="rotate(25 -180 65)" />
      <!-- Lower base of lung -->
      <ellipse cx="-155" cy="105" rx="23" ry="14" transform="rotate(35 -155 105)" />
      <ellipse cx="-125" cy="135" rx="20" ry="12" transform="rotate(45 -125 135)" />
      <ellipse cx="-90" cy="140" rx="18" ry="11" transform="rotate(60 -90 140)" />

      <!-- Eucalyptus / Myrtle leaves (эвкалиптовые листья — символ чистого дыхания) -->
      <path d="M -130 -140 Q -110 -160 -100 -185 Q -120 -170 -130 -140 Z" />
      <path d="M -160 -135 Q -145 -160 -135 -190 Q -155 -170 -160 -135 Z" />
      <path d="M -190 -85 Q -210 -100 -235 -110 Q -225 -85 -190 -85 Z" />
      <path d="M -205 -35 Q -230 -40 -255 -35 Q -235 -15 -205 -35 Z" />
      <path d="M -210 25 Q -240 35 -260 55 Q -235 60 -210 25 Z" />
      <path d="M -195 85 Q -220 110 -235 140 Q -210 130 -195 85 Z" />
    </g>

    <!-- Right Lung Foliage (Правое крыло лёгкого) -->
    <g fill="url(#lungFoliage)" stroke="#264332" stroke-width="0.5" opacity="0.9">
      <!-- Upper lobe -->
      <ellipse cx="130" cy="-100" rx="22" ry="14" transform="rotate(35 130 -100)" />
      <ellipse cx="165" cy="-115" rx="18" ry="11" transform="rotate(40 165 -115)" />
      <ellipse cx="110" cy="-75" rx="19" ry="12" transform="rotate(20 110 -75)" />
      <ellipse cx="150" cy="-65" rx="20" ry="13" transform="rotate(30 150 -65)" />
      <!-- Middle region -->
      <ellipse cx="185" cy="-25" rx="22" ry="13" transform="rotate(15 185 -25)" />
      <ellipse cx="195" cy="20" rx="23" ry="14" transform="rotate(-10 195 20)" />
      <ellipse cx="155" cy="15" rx="22" ry="14" transform="rotate(0 155 15)" />
      <ellipse cx="180" cy="65" rx="22" ry="13" transform="rotate(-25 180 65)" />
      <!-- Lower base of lung -->
      <ellipse cx="155" cy="105" rx="23" ry="14" transform="rotate(-35 155 105)" />
      <ellipse cx="125" cy="135" rx="20" ry="12" transform="rotate(-45 125 135)" />
      <ellipse cx="90" cy="140" rx="18" ry="11" transform="rotate(-60 90 140)" />

      <!-- Eucalyptus leaves on right -->
      <path d="M 130 -140 Q 110 -160 100 -185 Q 120 -170 130 -140 Z" />
      <path d="M 160 -135 Q 145 -160 135 -190 Q 155 -170 160 -135 Z" />
      <path d="M 190 -85 Q 210 -100 235 -110 Q 225 -85 190 -85 Z" />
      <path d="M 205 -35 Q 230 -40 255 -35 Q 235 -15 205 -35 Z" />
      <path d="M 210 25 Q 240 35 260 55 Q 235 60 210 25 Z" />
      <path d="M 195 85 Q 220 110 235 140 Q 210 130 195 85 Z" />
    </g>

    <!-- Radiant heart center / diaphragm opening in the middle -->
    <circle cx="0" cy="20" r="18" fill="#F8E5BA" fill-opacity="0.8" />
    <circle cx="0" cy="20" r="8" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Luminous Fresh Oxygen & Air Particles (Ощущение чистого воздуха и лёгкости) -->
  <g fill="#43946E" opacity="0.7">
    <circle cx="480" cy="220" r="3" />
    <circle cx="510" cy="190" r="2.2" />
    <circle cx="540" cy="240" r="2.5" />
    <circle cx="580" cy="150" r="3.2" fill="#58B88C" />
    <circle cx="620" cy="110" r="2.8" />
    <circle cx="660" cy="90" r="3.5" fill="#78D8AE" />
    <circle cx="700" cy="130" r="2.5" />
    <circle cx="750" cy="160" r="3" />
    <circle cx="790" cy="210" r="2.2" />
    <circle cx="830" cy="250" r="2.8" />
    <circle cx="860" cy="310" r="2.4" />
    <circle cx="440" cy="300" r="2.2" />
    <circle cx="390" cy="360" r="2" />
  </g>

  <!-- Left Edge Gentle Seamless Fade to Card Background (#FDFBF7) -->
  <rect x="0" y="0" width="220" height="600" fill="url(#leftFadeAsthma)" />
  <defs>
    <linearGradient id="leftFadeAsthma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDFBF7" stop-opacity="1" />
      <stop offset="60%" stop-color="#FDFBF7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDFBF7" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
